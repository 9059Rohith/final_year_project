name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # The import chain (config/auth/contact routers) needs these, but NOT the
        # heavy ML stack (torch/transformers) — kept out to keep CI fast.
        run: |
          pip install pytest fastapi "pydantic[email]==2.7.1" pydantic-settings \
            bcrypt==4.1.3 python-jose motor python-multipart
      - name: Run tests
        env:
          PYTHONUTF8: "1"
          # Dummy config so Settings() loads without a real .env in CI.
          MONGODB_URL: "mongodb://localhost:27017"
          DB_NAME: "test"
          JWT_SECRET_KEY: "ci-test-secret"
          ADMIN_EMAIL: "admin@example.com"
          ADMIN_PASSWORD: "ci-test-password"
          CORS_ORIGIN: "http://localhost:5173"
          CLOUDINARY_CLOUD_NAME: "test"
          CLOUDINARY_API_KEY: "test"
          CLOUDINARY_API_SECRET: "test"
        run: python -m pytest

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpeakEasyAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
